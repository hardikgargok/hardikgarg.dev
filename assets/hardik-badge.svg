<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .spin {
      transform-origin: 32px 32px;
      animation: spin 6s linear infinite;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
  <rect width="64" height="64" rx="14" fill="#050505"/>
  <g class="spin" fill="none" stroke="#a84bd0" stroke-linecap="round" stroke-width="3">
    <circle cx="32" cy="32" r="24" stroke-dasharray="10 8"/>
    <circle cx="32" cy="32" r="16" stroke-dasharray="2 7"/>
  </g>
  <circle cx="32" cy="32" r="7" fill="#a84bd0"/>
  <circle cx="32" cy="32" r="3" fill="#050505"/>
</svg>
